name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install workspace dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Vendored upstream text matches the lock
        run: npm run vendor:verify
      - name: Syntax check both packages
        run: npm run check
      - name: Unit tests
        run: npm test
